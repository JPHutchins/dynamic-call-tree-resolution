name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # The shape is pinned so a tasks.py refactor fails here rather than handing
      # the downstream jobs a differently-shaped object.
      - id: emit
        run: echo "matrix=$(uv run camas matrix --github-matrix=axes)" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ${{ fromJSON(needs.discover.outputs.matrix).PY }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - run: uv run camas
        env:
          UV_PYTHON: ${{ matrix.python }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - run: uv run camas coverage --effects='(Status(output_mode="all"),)'
