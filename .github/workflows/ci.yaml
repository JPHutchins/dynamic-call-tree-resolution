name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # The shape is pinned so a tasks.py refactor fails here rather than handing
      # the downstream jobs a differently-shaped object.
      - id: emit
        run: echo "matrix=$(uvx camas --github-matrix=variants)" >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.PY }})
    needs: discover
    strategy:
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - &install-nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - &restore-nix-store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'testbeds/**', 'tests/fixtures/sensor-two-impl-app/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G

      - run: nix develop --command uv run camas --PY="${{ matrix.PY }}"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - *checkout

      - *install-nix

      - *restore-nix-store

      - run: nix develop --command uv run camas coverage --effects='(Status(output_mode="all"),)'
