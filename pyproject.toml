[project]
name = "dynamic-call-tree-resolution"
version = "0.1.0"
description = "Static resolution of indirect calls in embedded firmware ELF images for worst-case stack usage analysis."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "JP Hutchins", email = "jphutchins@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "capstone>=5.0.9",
    "cyclopts>=5.0.0",
    "msgspec>=0.21.1",
    "pyelftools>=0.33",
    "salix",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]

[project.scripts]
dctr = "dynamic_call_tree_resolution.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "anytree>=2.13.0",
    "canopen>=2.4.1",
    "cmake>=4.4.3",
    "cryptography>=50.0.1",
    "intelhex>=2.3.0",
    "jsonschema>=4.26.0",
    "ninja>=1.13.2",
    "packaging>=26.3",
    "psutil>=5.6.6",
    "pyelftools>=0.33",
    "pykwalify>=1.8.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "requests>=2.33.0",
    "semver>=3.1.0",
    "tqdm>=4.67.1",
    "west>=1.5.0",
]
dev = [
    "actionlint-py>=1.7.12.25",
    "camas[mcp]>=0.1.29",
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
testpaths = ["src", "tests"]
norecursedirs = ["fixtures"]
markers = [
    "slow: tests excluded from the default check run",
    "image: analyzes a committed firmware image; check_fast skips it",
]

[tool.ruff]
line-length = 100
exclude = ["testbeds", "references"]

[tool.ruff.lint]
# preview is on solely to reach the DOC rules; explicit-preview-rules keeps
# every other preview rule out until selected by exact code.
preview = true
explicit-preview-rules = true
select = [
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "DOC102", # pydoclint (preview): documented params that don't exist
    "DOC202", # pydoclint (preview): documented returns that don't exist
    "DOC403", # pydoclint (preview): documented yields that don't exist
    "DOC501", # pydoclint (preview): raised exceptions must be documented
    "DOC502", # pydoclint (preview): documented exceptions that aren't raised
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "PYI",    # flake8-pyi
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "TC",     # flake8-type-checking
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020
]
# DOC201/DOC402 (missing returns/yields sections) are deliberately absent:
# annotations are the single source of truth for parameter and return types,
# so docstrings document only what the type system cannot — raised exceptions.
ignore = [
    # tab indentation + formatter conflicts
    # (https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules)
    "W191",
    "E101",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "ISC001",
    "ISC002",
    "E501",    # the formatter owns line length; the rest is unbreakable doctest output
    "D102",    # effect methods implement the documented Effect protocol contract
    "D103",    # code should document itself; a needed comment is a symptom
    "D105",    # magic method contracts are defined by the data model, not prose
    "D107",    # __init__ is documented by its class
    "D417",    # params belong to the type system, not prose (see DOC201/DOC402 above)
    "PLC0415", # imports are scoped as narrowly as possible, by design
    "PLR0911", # complexity thresholds reward fragmentation over clarity
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004", # honest small numbers
    "TRY003",  # messages live in the raise; no exception-class zoo
    "TRY004",  # ValueError is the CLI's user-error channel (dispatch catches it)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"typings/**" = ["D", "N802"] # stub files mirror the external library's API names

[tool.ruff.format]
indent-style = "tab"

[tool.mypy]
strict = true
warn_unused_ignores = true
disallow_any_explicit = true
disallow_any_expr = true
enable_error_code = ["exhaustive-match"]
mypy_path = "typings"
exclude = ["testbeds", "references", "typings", "build", "dist", ".camas"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "tasks.py"]
exclude = ["**/__pycache__", ".venv*", "testbeds/**", "references/**", "typings/**"]
stubPath = "typings"

[tool.coverage.run]
source = ["dynamic_call_tree_resolution", "tests"]
branch = true

[tool.coverage.report]
fail_under = 100
partial_branches = ["pragma: no branch"]
exclude_lines = [
    "@overload",
    "assert_never",
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if (typing\\.)?TYPE_CHECKING",
    ':\\s*\\.\\.\\.\\s*$',
    '^\\s*\\.\\.\\.\\s*$',
    "raise AssertionError",
]

[tool.uv.sources]
salix = { git = "https://github.com/JPHutchins/salix", rev = "21ded22dca2feb2af1ebefad69ea99c29b42507e" }
