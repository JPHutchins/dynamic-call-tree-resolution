# Two existing sensor impls on one emulated I2C bus: the driver-class
# dispatch the analysis resolves per thread.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_EMUL=y
CONFIG_ADT7420=y
CONFIG_BMI160=y
CONFIG_BMI160_TRIGGER_NONE=y
CONFIG_EMUL_BMI160=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STD_C23=y
CONFIG_GNU_C_EXTENSIONS=y
