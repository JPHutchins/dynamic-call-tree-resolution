# A user thread that takes a semaphore through syscalls, and a supervisor
# thread that gives it. The minimal libc keeps errno out of TLS, so each
# thread's stack holds the userspace-local data.
CONFIG_USERSPACE=y
CONFIG_MINIMAL_LIBC=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STD_C23=y
CONFIG_GNU_C_EXTENSIONS=y
