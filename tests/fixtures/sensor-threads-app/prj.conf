# One thread entry for two static threads, each bound to a sensor on
# its own emulated bus: the ADT7420 on I2C and the BMI160 on SPI.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_EMUL=y
CONFIG_ADT7420=y
CONFIG_BMI160=y
CONFIG_BMI160_TRIGGER_NONE=y
CONFIG_EMUL_BMI160=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STD_C23=y
CONFIG_GNU_C_EXTENSIONS=y
